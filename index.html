<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4A7784">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="AGORAMED — plataforma de educação médica para recém-formados e internos: cursos em vídeo, PDFs e canal de dúvidas.">
  <title>AGORAMED — Entrar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* Tipografia da tela de login.
       Padrão: fonte do sistema (carrega na hora e não baixa arquivos).
       Opcional, via URL: ?fonte=josefin | jost | titulos
       Nesse caso a folha css/fontes.css é carregada sob demanda (só então
       os arquivos de fonte são baixados). Usada por previa.html. */
    (function () {
      const modo = new URLSearchParams(location.search).get('fonte') || 'sistema';
      const classe = {
        josefin: 'fonte-destaque',
        jost: 'fonte-alt',
        titulos: 'fonte-destaque-titulos',
      }[modo];
      if (!classe) return;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'css/fontes.css';
      document.head.appendChild(link);
      document.documentElement.classList.add(classe);
    })();
  </script>
</head>
<body>

  <main class="tela-login">
    <section class="cartao-login">
      <!-- logomarca completa (símbolo + AGORAMED + assinatura) -->
      <h1 class="marca-login">
        <img src="img/agoramed-logo.png" alt="AGORAMED" width="1871" height="381">
      </h1>
      <!-- subtítulo já está na logomarca (img/agoramed-logo.png) -->

      <div class="abas-login" role="tablist">
        <button type="button" id="aba-entrar" class="ativo" role="tab">Entrar</button>
        <button type="button" id="aba-cadastrar" role="tab">Criar conta</button>
      </div>

      <div id="mensagem" class="aviso oculto" role="alert"></div>

      <!-- LOGIN -->
      <form id="form-entrar" autocomplete="on" style="margin-top:16px">
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="voce@email.com">
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="button" id="link-esqueci" style="background:none;border:none;padding:0;margin:-6px 0 14px;font-size:.82rem;color:var(--petroleo);font-weight:600;cursor:pointer;text-decoration:underline">
          Esqueci minha senha
        </button>
        <button type="submit" class="btn" style="width:100%">Entrar na plataforma</button>
      </form>

      <!-- RECUPERAÇÃO DE SENHA -->
      <form id="form-esqueci" class="oculto" style="margin-top:16px">
        <div class="campo">
          <label for="rec-email">E-mail da sua conta</label>
          <input type="email" id="rec-email" required autocomplete="email" placeholder="voce@email.com">
        </div>
        <button type="submit" class="btn" style="width:100%">Enviar link de redefinição</button>
        <p class="dica" style="margin-top:10px;font-size:.8rem;color:var(--texto-suave);text-align:center">
          Enviaremos um link seguro por e-mail para você criar uma nova senha.
        </p>
        <button type="button" id="link-voltar-login" style="background:none;border:none;padding:6px 0 0;font-size:.82rem;color:var(--petroleo);font-weight:600;cursor:pointer;text-decoration:underline;width:100%">
          Voltar para o login
        </button>
      </form>

      <!-- CADASTRO -->
      <form id="form-cadastrar" class="oculto" style="margin-top:16px">
        <div class="campo">
          <label for="cad-nome">Nome completo <span class="obrig">*</span></label>
          <input type="text" id="cad-nome" required autocomplete="name" placeholder="Dra. Ana Souza">
        </div>
        <div class="campo">
          <label for="cad-email">E-mail <span class="obrig">*</span></label>
          <input type="email" id="cad-email" required autocomplete="email" placeholder="voce@email.com">
        </div>
        <div class="campo">
          <label for="cad-whats">WhatsApp com DDD <span class="obrig">*</span></label>
          <input type="tel" id="cad-whats" required autocomplete="tel" inputmode="numeric"
                 placeholder="11 98765-4321" title="Informe o WhatsApp com DDD (ex.: 11 98765-4321)">
        </div>
        <div class="campo">
          <label for="cad-senha">Senha <span class="obrig">*</span></label>
          <input type="password" id="cad-senha" required autocomplete="new-password" minlength="6" placeholder="mínimo 6 caracteres">
        </div>
        <div class="campo">
          <label for="cad-confirmar-senha">Confirmar senha <span class="obrig">*</span></label>
          <input type="password" id="cad-confirmar-senha" required autocomplete="new-password" placeholder="Digite a senha novamente">
        </div>
        <button type="submit" class="btn" style="width:100%">Criar conta</button>
        <p class="dica" style="margin-top:10px;font-size:.8rem;color:var(--texto-suave);text-align:center">
          Após o cadastro, confirme seu e-mail e aguarde a liberação pelo professor.
        </p>
      </form>
    </section>

    <!-- assinatura da marca, fora do cartão (sobre o fundo azul-petróleo) -->
    <footer class="rodape-login">
      <img src="img/agoramed-simbolo-branco.png" alt="" width="468" height="381" aria-hidden="true">
      <span>Decisões seguras, baseadas em evidências.</span>
    </footer>
  </main>

  <script src="js/store.js"></script>
  <script type="module">
    const msg = document.getElementById('mensagem');
    const params = new URLSearchParams(location.search);

    /* link do e-mail de recuperação caiu aqui sem passar por redefinir.html?
       (acontece quando o Supabase usa a Site URL como destino) — segue com os tokens */
    if (location.hash.includes('access_token') && location.hash.includes('type=recovery')) {
      location.replace('redefinir.html' + location.hash);
    }

    function mostrarMsg(texto, tipo = 'erro') {
      if (!texto) { msg.textContent = ''; msg.className = 'aviso oculto'; return; }
      msg.textContent = texto;
      msg.className = 'aviso ' + (tipo === 'erro' ? 'erro' : 'sucesso');
      msg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    if (params.get('pendente') === '1') {
      mostrarMsg('Sua conta ainda está aguardando liberação. Assim que o professor liberar, você poderá entrar.', 'erro');
    } else if (params.get('redefinir') === 'ok') {
      mostrarMsg('Senha redefinida com sucesso! Entre com a nova senha.', 'sucesso');
    } else if (params.get('redefinir') === 'erro') {
      mostrarMsg('O link de redefinição é inválido ou expirou. Solicite um novo.', 'erro');
    } else if (params.get('confirmado') === '1') {
      mostrarMsg('E-mail confirmado! Faça login para continuar.', 'sucesso');
    }

    /* abas + recuperação de senha */
    const abaEntrar = document.getElementById('aba-entrar');
    const abaCadastrar = document.getElementById('aba-cadastrar');
    const formEntrar = document.getElementById('form-entrar');
    const formCadastrar = document.getElementById('form-cadastrar');
    const formEsqueci = document.getElementById('form-esqueci');
    function ativarAba(qual) {
      const ehEntrar = qual === 'entrar';
      abaEntrar.classList.toggle('ativo', ehEntrar && qual !== 'esqueci');
      abaCadastrar.classList.toggle('ativo', qual === 'cadastrar');

      /* anima o formulário que vai aparecer */
      [formEntrar, formCadastrar, formEsqueci].forEach((f) => {
        f.classList.add('oculto');
        f.classList.remove('form-animar');
      });
      const alvo = qual === 'cadastrar' ? formCadastrar
                  : qual === 'esqueci' ? formEsqueci
                  : formEntrar;
      /* força reflow para reiniciar a animação */
      void alvo.offsetWidth;
      alvo.classList.remove('oculto');
      alvo.classList.add('form-animar');

      if (qual === 'esqueci') abaEntrar.classList.remove('ativo');
      mostrarMsg('');
    }
    abaEntrar.addEventListener('click', () => ativarAba('entrar'));
    abaCadastrar.addEventListener('click', () => ativarAba('cadastrar'));
    document.getElementById('link-esqueci').addEventListener('click', () => ativarAba('esqueci'));
    document.getElementById('link-voltar-login').addEventListener('click', () => ativarAba('entrar'));

    /* se já houver sessão, segue direto (exceto na página de teste visual) */
    if (!params.get('preview')) {
      const u = await Store.iniciar();
      if (u) location.href = 'app.html';
    }

    formEntrar.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = formEntrar.querySelector('[type=submit]');
      btn.disabled = true;
      mostrarMsg('Verificando…', 'sucesso');
      const r = await Store.entrar(document.getElementById('login-email').value, document.getElementById('login-senha').value);
      btn.disabled = false;
      if (!r.ok) return mostrarMsg(r.erro);
      location.href = 'app.html';
    });

    formCadastrar.addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = document.getElementById('cad-senha').value;
      const confirmarSenha = document.getElementById('cad-confirmar-senha');
      if (senha !== confirmarSenha.value) {
        mostrarMsg('senha nao confere');
        confirmarSenha.focus();
        return;
      }
      const btn = formCadastrar.querySelector('[type=submit]');
      btn.disabled = true;
      const r = await Store.cadastrar(
        document.getElementById('cad-nome').value,
        document.getElementById('cad-email').value,
        senha,
        document.getElementById('cad-whats').value
      );
      btn.disabled = false;
      if (!r.ok) return mostrarMsg(r.erro);
      document.getElementById('login-email').value = document.getElementById('cad-email').value;
      formCadastrar.reset();
      ativarAba('entrar');
      mostrarMsg(r.msg || 'Solicitação recebida. Se já tem conta, entre com a senha original ou use “Esqueci minha senha”.', 'sucesso');
    });

    formEsqueci.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = formEsqueci.querySelector('[type=submit]');
      btn.disabled = true;
      const r = await Store.esqueciSenha(document.getElementById('rec-email').value);
      btn.disabled = false;
      mostrarMsg((r && r.ok ? r.msg : (r && r.erro)) || 'Verifique sua caixa de entrada.', r && r.ok ? 'sucesso' : 'erro');
    });
  </script>
</body>
</html>
