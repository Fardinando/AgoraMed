<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4A7784">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AGORAMED — Curso</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png?v=2" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v2.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topo">
    <div class="container">
      <a class="marca" href="app.html" aria-label="AGORAMED — início"><img src="img/agoramed-simbolo-branco.png" alt="" class="simbolo-marca" width="468" height="381"><span class="nome-marca">AGORAMED</span></a>
      <span class="espaco"></span>
      <a href="app.html" class="btn-instalar">← Meus cursos</a>
      <div style="position:relative">
        <button class="usuario-chip" id="chip-usuario" type="button">
          <span class="avatar" id="avatar-topo">?</span>
          <span class="nome-usuario" id="nome-topo">…</span> ▾
        </button>
        <div class="menu-usuario oculto" id="menu-usuario">
          <a href="admin.html" id="item-admin" class="oculto">⚙️ Painel do professor</a>
          <button type="button" id="btn-sair">↩️ Sair</button>
        </div>
      </div>
    </div>
  </header>

  <section class="capa-curso">
    <div class="container">
      <a class="voltar" href="app.html">← Voltar para meus cursos</a>
      <h1 id="c-titulo">…</h1>
      <p class="sub" id="c-sub"></p>
      <div class="meta-curso" id="c-meta"></div>
      <div class="progresso-geral" id="c-progresso">
        <div class="barra-progresso"><span style="width:0%"></span></div>
        <span class="progresso-texto"></span>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="modulos" id="lista-modulos"></div>
    <div class="aviso oculto" id="sem-acesso">Este curso não está disponível para a sua conta.</div>
  </main>

  <footer class="rodape">
    <div class="container">Decisões seguras, baseadas em evidências.</div>
  </footer>

  <script src="js/store.js"></script>
  <script type="module">
    await Store.iniciar({ atualizar: new URLSearchParams(location.search).get('atualizar') === '1' });
    const usuario = Store.proteger();

    document.getElementById('nome-topo').textContent = usuario.nome.split(' ')[0];
    document.getElementById('avatar-topo').textContent = UI.iniciais(usuario.nome);

    /* menu do usuário (mesmo do app.html): painel do professor + sair */
    document.getElementById('item-admin').classList.toggle('oculto', usuario.papel !== 'admin');
    const chip = document.getElementById('chip-usuario');
    const menu = document.getElementById('menu-usuario');
    chip.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('oculto'); });
    document.addEventListener('click', () => menu.classList.add('oculto'));
    document.getElementById('btn-sair').addEventListener('click', UI.sair);

    const cursoId = new URLSearchParams(location.search).get('id');
    const curso = Store.acharCurso(cursoId);
    /* o servidor já devolve só os cursos que este usuário pode ver */
    const permitido = !!curso;

    if (!permitido) {
      document.getElementById('sem-acesso').classList.remove('oculto');
      document.getElementById('lista-modulos').innerHTML = '';
    } else {
      const est = Store.estatisticasCurso(curso);
      document.title = `AGORAMED — ${curso.titulo}`;
      document.getElementById('c-titulo').textContent = curso.titulo;
      document.getElementById('c-sub').textContent = curso.subtitulo || curso.descricao || '';

      const pills = [
        curso.tipoAcesso === 'gratis' ? 'Gratuito' : 'Acesso liberado',
        curso.categoria, curso.nivel,
        `${est.modulos} módulo${est.modulos === 1 ? '' : 's'}`,
        `${est.aulas} aula${est.aulas === 1 ? '' : 's'}`,
        est.duracao,
        est.pdfs ? `${est.pdfs} material(is) em PDF` : '',
      ].filter(Boolean);
      document.getElementById('c-meta').innerHTML = pills.map(p => `<span class="pill">${UI.escapar(p)}</span>`).join('');

      const prog = Store.progressoCurso(usuario.id, curso);
      const boxProg = document.getElementById('c-progresso');
      if (prog.total) {
        boxProg.querySelector('.barra-progresso span').style.width = prog.percentual + '%';
        boxProg.querySelector('.progresso-texto').textContent =
          prog.percentual === 100 ? `✅ Curso concluído (${prog.total} aulas)` : `${prog.feitas} de ${prog.total} aulas concluídas · ${prog.percentual}%`;
      } else {
        boxProg.classList.add('oculto');
      }

      const lista = document.getElementById('lista-modulos');
      if (!est.modulos) {
        lista.innerHTML = '<div class="aviso">Este curso ainda está sendo montado. Volte em breve!</div>';
      } else {
        lista.innerHTML = curso.modulos.map((m, i) => {
          const aulas = m.aulas || [];
          const temPdf = aulas.some(a => (a.pdfs || []).length);
          return `
          <details class="modulo" ${i === 0 ? 'open' : ''}>
            <summary>
              <span class="num">${i + 1}</span>
              <span class="titulo-mod">${UI.escapar(m.titulo)}</span>
              <span class="qtd">${aulas.length} aula${aulas.length === 1 ? '' : 's'}</span>
              <span class="seta">▾</span>
            </summary>
            <div class="lista-aulas">
              ${aulas.length ? aulas.map((a, j) => {
                const concluida = Store.estaConcluida(usuario.id, a.id);
                return `
                <a class="aula-linha ${concluida ? 'concluida' : ''}" href="aula.html?c=${curso.id}&m=${m.id}&a=${a.id}">
                  <span class="icone">${concluida ? '✓' : '▶'}</span>
                  <span class="texto">
                    <strong>${j + 1}. ${UI.escapar(a.titulo)}</strong>
                    <small>${UI.escapar(a.duracao || '—')}${a.descricao ? ' · ' + UI.escapar(a.descricao) : ''}</small>
                  </span>
                  <span class="sinalizadores">${(a.pdfs || []).length ? `<span class="tag-pdf">PDF ×${a.pdfs.length}</span>` : ''}</span>
                </a>`;
              }).join('') : '<div class="aula-linha" style="color:var(--texto-suave)"><span class="texto"><small>Aulas em produção — volte em breve.</small></span></div>'}
            </div>
          </details>`;
        }).join('');
      }
    }

    UI.navInferior('cursos');
  </script>
</body>
</html>
